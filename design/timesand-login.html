<title>TimeSand · 登录</title>
<style>
:root{
  --bg-0:        oklch(13.5% 0.012 55);
  --bg-1:        oklch(16% 0.014 58);
  --surface:     oklch(19.5% 0.016 60);
  --surface-hi:  oklch(23% 0.018 62);
  --border:      oklch(28% 0.020 60);
  --border-hi:   oklch(36% 0.025 62);
  --fg:          oklch(93% 0.018 75);
  --fg-soft:     oklch(78% 0.025 70);
  --muted:       oklch(58% 0.028 65);
  --muted-2:     oklch(44% 0.022 62);
  --amber-1:     oklch(78% 0.13 75);
  --amber-2:     oklch(70% 0.14 65);
  --amber-3:     oklch(58% 0.13 55);
  --amber-glow:  oklch(72% 0.15 70 / .35);
  --ok:          oklch(72% 0.13 75);
  --warn:        oklch(68% 0.16 35);
  --font-display:'Cormorant Garamond','Iowan Old Style','Source Han Serif SC','Songti SC',Georgia,serif;
  --font-body:   -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
  --font-mono:   ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg-0);color:var(--fg);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg::before{content:"";position:absolute;left:50%;top:38%;width:1100px;height:1100px;transform:translate(-50%,-50%);background:radial-gradient(circle, oklch(38% 0.06 60 / .55) 0%, transparent 55%);filter:blur(20px)}
.bg::after{content:"";position:absolute;left:50%;top:38%;width:520px;height:520px;transform:translate(-50%,-50%);background:radial-gradient(circle, oklch(60% 0.12 65 / .18) 0%, transparent 60%)}
.grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:screen}
.grain i{position:absolute;width:2px;height:2px;border-radius:50%;background:oklch(85% 0.06 75 / .55);box-shadow:0 0 6px 1px oklch(75% 0.10 70 / .35)}
.topbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:22px 28px}
.brand-mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(140deg, var(--amber-1), var(--amber-3));box-shadow:0 0 24px var(--amber-glow), inset 0 1px 0 oklch(100% 0 0 / .35)}
.brand-mark svg{width:14px;height:14px;display:block}
.brand-wm{display:flex;flex-direction:column;line-height:1;gap:3px}
.brand-wm .nm{font-size:14px;letter-spacing:.01em;color:var(--fg)}
.brand-wm .sb{font:9px/1 var(--font-mono);letter-spacing:.28em;color:var(--muted-2)}
.stage{position:relative;z-index:1;min-height:calc(100vh - 72px);display:flex;flex-direction:column;align-items:center;padding:24px 24px 80px}
.card{width:100%;max-width:380px;margin-top:40px;background:linear-gradient(180deg, var(--surface) 0%, var(--bg-1) 100%);border:1px solid var(--border);border-radius:18px;padding:40px 36px 32px;position:relative;box-shadow:0 1px 0 oklch(100% 0 0 / .04) inset, 0 30px 80px -20px rgba(0,0,0,.6), 0 0 0 1px oklch(100% 0 0 / .015)}
h1.title{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.1;letter-spacing:-.005em;color:var(--fg);text-align:center}
h1.title em{font-style:italic;font-weight:400;color:var(--amber-2)}
.form{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.field{position:relative}
.input-wrap{position:relative;background:var(--surface-hi);border:1px solid var(--border);border-radius:10px;transition:border-color .18s, box-shadow .18s, background .18s}
.input-wrap:hover{border-color:var(--border-hi)}
.input-wrap:focus-within{border-color:var(--amber-2);background:oklch(22% 0.018 62);box-shadow:0 0 0 3px oklch(70% 0.14 65 / .14)}
.field.has-error .input-wrap{border-color:var(--warn);box-shadow:0 0 0 3px oklch(68% 0.16 35 / .14)}
.input-wrap input{width:100%;background:transparent;border:0;outline:0;color:var(--fg);font:14px/1 var(--font-body);padding:13px 14px 13px 42px;letter-spacing:.005em}
.input-wrap input::placeholder{color:var(--muted-2);letter-spacing:.01em}
.input-wrap .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.input-wrap .toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;background:transparent;border:0;cursor:pointer;color:var(--muted);display:grid;place-items:center;transition:color .15s, background .15s}
.input-wrap .toggle:hover{color:var(--fg-soft);background:oklch(28% 0.02 60)}
.input-wrap .toggle svg{width:16px;height:16px}
.help{margin-top:7px;font-size:11.5px;color:var(--warn);letter-spacing:.01em;display:none}
.field.has-error .help{display:block}
.row{margin-top:6px;display:flex;align-items:center;justify-content:space-between}
.check{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:13px;color:var(--fg-soft);position:relative}
.check input{position:absolute;opacity:0;pointer-events:none}
.box{width:16px;height:16px;border-radius:5px;border:1px solid var(--border-hi);background:var(--surface-hi);display:grid;place-items:center;transition:all .15s}
.box svg{width:11px;height:11px;color:oklch(20% 0.02 60);opacity:0;transform:scale(.6);transition:opacity .15s, transform .15s}
.check input:checked + .box{background:linear-gradient(140deg, var(--amber-1), var(--amber-3));border-color:var(--amber-3);box-shadow:0 0 12px var(--amber-glow)}
.check input:checked + .box svg{opacity:1;transform:scale(1)}
.submit{margin-top:22px;width:100%;height:48px;border:0;border-radius:999px;cursor:pointer;font:13.5px/1 var(--font-body);letter-spacing:.02em;color:oklch(18% 0.03 60);background:linear-gradient(180deg, var(--amber-1) 0%, var(--amber-2) 55%, var(--amber-3) 100%);box-shadow:0 1px 0 oklch(100% 0 0 / .35) inset, 0 -1px 0 oklch(0% 0 0 / .25) inset, 0 8px 22px -6px var(--amber-glow), 0 0 0 1px oklch(60% 0.13 60 / .35);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease, box-shadow .2s, filter .2s, background .2s;position:relative;overflow:hidden}
.submit:hover{filter:brightness(1.05)}
.submit:active{transform:translateY(1px)}
.submit:disabled{cursor:default;filter:none}
.submit .spinner{display:none}
.submit[data-state="loading"]{background:linear-gradient(180deg, oklch(36% 0.03 60), oklch(24% 0.02 60));color:var(--fg-soft);box-shadow:0 1px 0 oklch(100% 0 0 / .06) inset, 0 0 0 1px var(--border)}
.submit[data-state="loading"] .label{display:none}
.submit[data-state="loading"] .spinner{display:inline-flex;align-items:center;gap:10px}
.submit[data-state="loading"] .spinner svg{animation:flip 1.8s ease-in-out infinite}
@keyframes flip{0%,45%{transform:rotate(0)}50%,95%{transform:rotate(180deg)}100%{transform:rotate(180deg)}}
.submit[data-state="success"]{background:linear-gradient(180deg, oklch(78% 0.14 80), oklch(62% 0.14 70));color:oklch(18% 0.03 60)}
.submit[data-state="success"] .label{display:none}
.submit[data-state="success"] .spinner{display:inline-flex;align-items:center;gap:8px}
.submit[data-state="success"] .spinner svg{animation:none}
.submit[data-state="failure"]{background:linear-gradient(180deg, oklch(48% 0.14 35), oklch(34% 0.10 30));color:oklch(96% 0.03 70);box-shadow:0 0 0 1px oklch(50% 0.16 35 / .5), 0 8px 22px -6px oklch(50% 0.16 35 / .35);animation:shake .4s ease}
.submit[data-state="failure"] .label{display:none}
.submit[data-state="failure"] .spinner{display:inline-flex;align-items:center;gap:8px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.flash{margin-top:18px;display:none;padding:11px 14px;border-radius:10px;font-size:12.5px;align-items:flex-start;gap:10px;line-height:1.5}
.flash.show{display:flex}
.flash.ok{background:oklch(28% 0.04 70);border:1px solid oklch(45% 0.08 70);color:oklch(92% 0.04 75)}
.flash.err{background:oklch(24% 0.05 35);border:1px solid oklch(40% 0.10 35);color:oklch(92% 0.04 50)}
.flash svg{flex:0 0 auto;width:14px;height:14px;margin-top:2px}
.demo-hint{margin-top:28px;text-align:center;font-size:11px;color:var(--muted-2);letter-spacing:.02em;line-height:1.55}
.demo-hint kbd{font:10.5px/1 var(--font-mono);color:var(--muted);letter-spacing:.04em}
.states{width:100%;max-width:760px;margin-top:64px}
.states-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.states-head .h{font-family:var(--font-display);font-size:22px;letter-spacing:.005em;color:var(--fg)}
.states-head .h em{color:var(--amber-2);font-style:italic;font-weight:400}
.states-head .l{font:10px/1 var(--font-mono);letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.states-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.state-cell{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:160px}
.state-cell .tag{font:10px/1 var(--font-mono);letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.state-cell .desc{font-size:12px;color:var(--fg-soft);line-height:1.5;margin-top:auto}
.state-cell .btn{height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font:13px/1 var(--font-body);pointer-events:none}
.state-cell .btn[data-state="idle"]{background:linear-gradient(180deg, var(--amber-1), var(--amber-2) 55%, var(--amber-3));color:oklch(18% 0.03 60);box-shadow:0 1px 0 oklch(100% 0 0 / .35) inset, 0 0 0 1px oklch(60% 0.13 60 / .35)}
.state-cell .btn[data-state="loading"]{background:linear-gradient(180deg, oklch(36% 0.03 60), oklch(24% 0.02 60));color:var(--fg-soft);box-shadow:0 0 0 1px var(--border) inset}
.state-cell .btn[data-state="loading"] svg{animation:flip 1.8s ease-in-out infinite}
.state-cell .btn[data-state="success"]{background:linear-gradient(180deg, oklch(78% 0.14 80), oklch(62% 0.14 70));color:oklch(18% 0.03 60)}
.state-cell .btn[data-state="failure"]{background:linear-gradient(180deg, oklch(48% 0.14 35), oklch(34% 0.10 30));color:oklch(96% 0.03 70);box-shadow:0 0 0 1px oklch(50% 0.16 35 / .5)}
@media (max-width:640px){.states-grid{grid-template-columns:repeat(2,1fr)}.card{padding:30px 24px 28px}h1.title{font-size:32px}}
</style>

</style><script data-od-tweaks-bridge="">(function(){

    var panel = panelEl();

    suppressEcho = true;
    document.documentElement.toggleAttribute('data-od-tweaks-hidden', !visible);

    // change so we don't echo our own host-driven toggles back to the host.
    Promise.resolve().then(function(){ suppressEcho = false; });

    var panel = panelEl();
    if (!panel) return;
    try {
      parent.postMessage({
        type: 'od:tweaks-panel-state',
        visible: !panel.classList.contains('tw-hidden'),
      }, '*');
    } catch (e) {}
  }

  function postAvailability(){
    try {
      parent.postMessage({
        type: 'od:tweaks-available',
        available: !!panelEl(),

    } catch (e) {}
  }

    var panel = panelEl();

    // Capture the panel authored visibility BEFORE we apply the host hidden
    // attribute. The bridge sets data-od-tweaks-hidden synchronously in head
    // (before the body parses), so on entry to onReady the attribute is
    // always present even though the artifact may have authored the panel
    // as default-visible. Reading the panel class first is the only place
    // we can still observe the author intent. Then drive the attribute,
    // classes, and posted state from that captured value so a default
    // visible tw-panel reports visible:true and the toolbar toggle starts
    // ON. Issue surfaced in PR #1643 review.
    var panel = panelEl();
    var initialVisible = !!panel && !panel.classList.contains('tw-hidden');
    document.documentElement.toggleAttribute('data-od-tweaks-hidden', !initialVisible);
    applyClassesToPanel(initialVisible);
    attachObserver();

    // the default state on mount. Without this the toggle reads OFF while
    // a default-visible tw-panel artifact clearly shows its panel and the
    // user would have to click toggle-on then toggle-off to actually hide.

function setFlash(kind,text){flash.className='flash show '+(kind==='ok'?'ok':'err');flashText.textContent=text}

  },delay);
});
[userEl,pwd].forEach(function(el){el.addEventListener('input',function(){el.closest('.field').classList.remove('has-error');if(submit.dataset.state==='failure'){setState('idle');clearFlash()}})});
