services:
  timesand:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    ports:
      - "8800:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      # Set TIMESAND_ADMIN_PASSWORD before first startup (>= 8 chars).
      # If omitted, the system stays uninitialized and login returns 503.
      # - TIMESAND_ADMIN_PASSWORD=changeme
